name: Physics Figures CI
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Typecheck + build
        run: npm run build
      - name: Content contract
        run: npm run contract
      - name: Link regression check
        run: npm run links
      - name: Accessibility gate
        run: npm run axe
      - name: Bundle budget
        run: npm run budget
      - name: Dependency audit
        run: npm audit --audit-level=high || true

  visual-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run screenshots

  repo-content-checks:
    # Fail if the upstream generators/checkers regress (PHYSICS_SPEC/05 §3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Check physics generators
        run: |
          cd ../trb 2>/dev/null || true
          if [ -f scripts/math/check-gen.js ]; then
            node scripts/math/check-gen.js phys1
            node scripts/math/check-course.js phys1
          else
            echo "Upstream repo not checked out in this workflow; content checks run in the ingest job."
          fi
